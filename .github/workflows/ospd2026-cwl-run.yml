name: Run CVI workflow with Docker and CWLProv

on:
  workflow_dispatch:

jobs:
  cvi-run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cwltool
        run: python3 -m pip install --upgrade cwltool

      - name: Build the workflow image
        run: |
          docker build --tag cvi-workflow:ci .
          docker tag cvi-workflow:ci ghcr.io/hartis-org/cvi-workflow:latest

      - name: Prepare CDSE credentials for this run
        env:
          CDSE_AWS_ACCESS_KEY_ID: ${{ secrets.CDSE_AWS_ACCESS_KEY_ID }}
          CDSE_AWS_SECRET_ACCESS_KEY: ${{ secrets.CDSE_AWS_SECRET_ACCESS_KEY }}
          CDSE_AWS_ENDPOINT_URL: ${{ secrets.CDSE_AWS_ENDPOINT_URL }}
          CDSE_AWS_DEFAULT_REGION: ${{ secrets.CDSE_AWS_DEFAULT_REGION }}
        run: |
          test -n "$CDSE_AWS_ACCESS_KEY_ID"
          test -n "$CDSE_AWS_SECRET_ACCESS_KEY"
          test -n "$CDSE_AWS_ENDPOINT_URL"
          test -n "$CDSE_AWS_DEFAULT_REGION"
          umask 077
          printf 'AWS_ACCESS_KEY_ID=%s\n' "$CDSE_AWS_ACCESS_KEY_ID" > config/tokens.env
          printf 'AWS_SECRET_ACCESS_KEY=%s\n' "$CDSE_AWS_SECRET_ACCESS_KEY" >> config/tokens.env
          printf 'AWS_ENDPOINT_URL=%s\n' "$CDSE_AWS_ENDPOINT_URL" >> config/tokens.env
          printf 'AWS_DEFAULT_REGION=%s\n' "$CDSE_AWS_DEFAULT_REGION" >> config/tokens.env

      - name: Run the CVI workflow and create CWLProv
        id: run_cvi
        run: |
          mkdir -p ci-artifacts/output ci-artifacts/cwlprov
          cwltool \
            --provenance "$GITHUB_WORKSPACE/ci-artifacts/cwlprov" \
            --outdir "$GITHUB_WORKSPACE/ci-artifacts/output" \
            --tmpdir-prefix "$GITHUB_WORKSPACE/ci-artifacts/tmp-" \
            --tmp-outdir-prefix "$GITHUB_WORKSPACE/ci-artifacts/out-" \
            cvi_workflow.cwl \
            job_cvi.yaml

      - name: Remove credentials from workflow artifact
        id: sanitize_artifact
        if: always()
        run: |
          find ci-artifacts -type f -name 'tokens.env' -print -delete
          if [ -d ci-artifacts/cwlprov/data ]; then
            find ci-artifacts/cwlprov/data -type f -print0 |
              xargs -0 grep -IlZ 'AWS_SECRET_ACCESS_KEY=' |
              xargs -0r rm -f
          fi
          find ci-artifacts \( -type f -o -type d \) \( -name 'tmp-*' -o -name 'out-*' \) -prune -exec rm -rf {} +
          if grep -RIlE 'AWS_(ACCESS_KEY_ID|SECRET_ACCESS_KEY)=[^[:space:]]+' ci-artifacts; then
            echo 'Credential values remain in the artifact; refusing to upload.'
            exit 1
          fi

      - name: Upload workflow outputs and provenance
        if: always() && steps.sanitize_artifact.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ospd2026-cvi-run-${{ github.run_id }}
          path: ci-artifacts/
          if-no-files-found: warn

      - name: Publish sanitized evidence pull request
        if: steps.run_cvi.outcome == 'success' && steps.sanitize_artifact.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          evidence_dir="ospd2026/evidence/runs/${GITHUB_RUN_ID}"
          mkdir -p "$evidence_dir"
          cp ci-artifacts/cwlprov/metadata/provenance/primary.cwlprov.json "$evidence_dir/primary.cwlprov.json"
          cp ci-artifacts/cwlprov/workflow/primary-output.json "$evidence_dir/primary-output.json"
          cp ci-artifacts/output/transects_with_cvi_equal.geojson "$evidence_dir/transects_with_cvi_equal.geojson"
          sha256sum "$evidence_dir"/* > "$evidence_dir/manifest.sha256"

          if grep -RIlE 'AWS_(ACCESS_KEY_ID|SECRET_ACCESS_KEY)=[^[:space:]]+' "$evidence_dir"; then
            echo 'Credential values found in generated evidence; refusing to publish.'
            exit 1
          fi

          branch="generated-evidence/${GITHUB_RUN_ID}"
          git switch --create "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$evidence_dir"
          git commit -m "Add sanitized CVI evidence for run ${GITHUB_RUN_ID}"
          git push --set-upstream origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "Add sanitized CVI evidence for run ${GITHUB_RUN_ID}" \
            --body "Automated evidence export from successful CVI workflow run ${GITHUB_RUN_ID}. The generated files passed the credential-value check."

      - name: Remove temporary credentials
        if: always()
        run: rm -f config/tokens.env
