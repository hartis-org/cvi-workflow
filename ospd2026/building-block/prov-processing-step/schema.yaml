$schema: https://json-schema.org/draft/2020-12/schema
title: HARTIS CVI Processing Step Provenance
description: >-
  A HARTIS implementation draft of the OSPD-2026 geospatial processing-step
  provenance profile, constrained to a single processing activity and tested
  against a Coastal Vulnerability Index workflow step.

allOf:
  - $ref: bblocks://ogc.ogc-utils.prov
  - type: object
    required:
      - id
      - processType
      - used
      - generated
    properties:
      id:
        description: Stable identifier for this processing step activity.
        type: string

      provType:
        description: PROV class for this record. Expected value is Activity.
        type: string

      processType:
        description: >-
          Identifier of the registered process type this step instantiates.
          During early HARTIS work this may be a provisional URI.
        type: string

      label:
        type: string

      startedAtTime:
        type: string
        format: date-time

      endedAtTime:
        type: string
        format: date-time

      used:
        description: Entity identifiers consumed by this step.
        type: array
        minItems: 1
        items:
          type: string

      generated:
        description: Entity identifiers produced by this step.
        type: array
        minItems: 1
        items:
          type: string

      qualifiedUsage:
        description: Role each consumed entity played in the step.
        type: array
        items:
          type: object
          required:
            - entity
            - hadRole
          properties:
            entity:
              type: string
            hadRole:
              type: string

      wasAssociatedWith:
        description: Software, service, person, organization, or execution environment associated with the step.
        type: array
        items:
          type: string

      wasInformedBy:
        description: Prior activities that informed this step.
        type: array
        items:
          type: string

      parameters:
        description: >-
          Parameter values that determined this processing step. Keys should
          later align with parameter terms declared by the registered process type.
        type: object
        additionalProperties: true

      sourceWorkflow:
        description: Workflow definition or package where this step is declared.
        type: string

      sourceCode:
        description: Script, notebook, or source file implementing the step.
        type: string
